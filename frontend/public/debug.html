<!DOCTYPE html>
<html>
<head>
    <title>Debug Environment Variables</title>
</head>
<body>
    <h1>Environment Debug</h1>
    <div id="debug-info"></div>
    
    <script>
        // Check what environment variables are available
        const backendUrl = process.env.REACT_APP_BACKEND_URL;
        
        document.getElementById('debug-info').innerHTML = `
            <p><strong>process.env.REACT_APP_BACKEND_URL:</strong> ${backendUrl || 'undefined'}</p>
            <p><strong>Location:</strong> ${window.location.href}</p>
            <p><strong>All env vars:</strong> ${JSON.stringify(process.env, null, 2)}</p>
        `;
        
        console.log('Debug - REACT_APP_BACKEND_URL:', backendUrl);
        console.log('Debug - All process.env:', process.env);
    </script>
</body>
</html>
